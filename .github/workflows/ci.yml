# CI: lint → typecheck → translations check → production build.
# Deploys are not started here: Vercel builds and deploys the `main` branch itself.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # No API runs here: pages fall back to their built-in content when it cannot be reached.
      API_INTERNAL_URL: http://127.0.0.1:4100
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      NEXT_PUBLIC_MEDIA_ORIGIN: http://127.0.0.1:9000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Translations
        run: npm run i18n:check

      - name: Build
        run: npm run build

      - name: Dependency audit (production dependencies, high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
